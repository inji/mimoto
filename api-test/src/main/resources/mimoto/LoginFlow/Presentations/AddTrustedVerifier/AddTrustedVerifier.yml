AddTrustedVerifier:
   Mimoto_AddTrustedVerifier_all_Valid_Smoke_sid:
      endPoint: /v1/mimoto/wallets/{walletId}/trusted-verifiers
      description: Validate adding a trusted verifier with valid data and verify that the operation succeeds
      uniqueIdentifier: TC_Mimoto_AddTrustedVerifier_01
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_UnlockWallet_01
      checkErrorsOnlyInResponse: true
      inputTemplate: mimoto/LoginFlow/Presentations/AddTrustedVerifier/AddTrustedVerifier
      outputTemplate: mimoto/LoginFlow/Presentations/AddTrustedVerifier/AddTrustedVerifierResult
      input: '{
        "cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
        "cookieName": "SESSION",
        "walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$",
        "verifierId": "$ID:VerifiablePresentationAuthorization_all_Valid_Smoke_sid_id$"
}'
      output: '{
}'

   Mimoto_AddTrustedVerifier_withEmpty_verifierId_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/trusted-verifiers
      description: Verify that adding a trusted verifier without a verifierId is not allowed and returns an appropriate error message
      uniqueIdentifier: TC_Mimoto_AddTrustedVerifier_02
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_UnlockWallet_01
      inputTemplate: mimoto/LoginFlow/Presentations/AddTrustedVerifier/AddTrustedVerifier
      outputTemplate: mimoto/error2
      input: '{
        "cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
        "cookieName": "SESSION",
        "walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$",
        "verifierId": ""
}'
      output: '{
        "errorCode": "invalid_request"
}'

   Mimoto_AddTrustedVerifier_withInvalid_walletId_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/trusted-verifiers
      description: Verify that adding a trusted verifier using an invalid walletId is not allowed and returns an appropriate error message
      uniqueIdentifier: TC_Mimoto_AddTrustedVerifier_03
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_UnlockWallet_01
      inputTemplate: mimoto/LoginFlow/Presentations/AddTrustedVerifier/AddTrustedVerifier
      outputTemplate: mimoto/error2
      input: '{
        "cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
        "cookieName": "SESSION",
        "walletId": "invalidWalletID",
        "verifierId": "$ID:VerifiablePresentationAuthorization_all_Valid_Smoke_sid_id$"
}'
      output: '{
        "errorCode": "invalid_request"
}'

   Mimoto_AddTrustedVerifier_withEmptyWalletID_walletId_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/trusted-verifiers
      description: Verify that adding a trusted verifier without a walletId is not allowed and returns an appropriate error message
      uniqueIdentifier: TC_Mimoto_AddTrustedVerifier_04
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_UnlockWallet_01
      inputTemplate: mimoto/LoginFlow/Presentations/AddTrustedVerifier/AddTrustedVerifier
      outputTemplate: mimoto/error2
      input: '{
        "cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
        "cookieName": "SESSION",
        "walletId": "",
        "verifierId": "$ID:VerifiablePresentationAuthorization_all_Valid_Smoke_sid_id$"
}'
      output: '{
        "errorCode": "invalid_request"
}'


   Mimoto_AddTrustedVerifier_withLocked_walletId_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/trusted-verifiers
      description: Verify that adding a trusted verifier with a locked walletId is not allowed and returns an appropriate error message
      uniqueIdentifier: TC_Mimoto_AddTrustedVerifier_05
      role: userDefinedCookie
      restMethod: post
      inputTemplate: mimoto/LoginFlow/Presentations/AddTrustedVerifier/AddTrustedVerifier
      outputTemplate: mimoto/error2
      input: '{
        "cookie": "$ID:GoogleLoginToken_all_ValidForLockedWallet_Smoke_sessionCookie$",
        "cookieName": "SESSION",
        "walletId": "$ID:CreateWallet_all_ValidForLockedWallet_Smoke_sid_walletId$",
        "verifierId": "$ID:VerifiablePresentationAuthorization_all_Valid_Smoke_sid_id$"
