   Mimoto_AddTrustedVerifier_withInvalidSession_unAuthorized_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/trusted-verifiers
      description: Verify that adding a trusted verifier using an invalid or expired session is not allowed and returns an appropriate authentication error
      uniqueIdentifier: TC_Mimoto_AddTrustedVerifier_06
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_UnlockWallet_01
      checkOnlyStatusCodeInResponse: true
      inputTemplate: mimoto/LoginFlow/Presentations/AddTrustedVerifier/AddTrustedVerifier
      outputTemplate: mimoto/responseCode
      input: '{
        "cookie": "OGYwNWI5YWQtZjg0MS00NmM2LWJiZTgtOGRmMWYwMGYzNzcy",
        "cookieName": "SESSION",
        "walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$",
        "verifierId": "$ID:VerifiablePresentationAuthorization_all_Valid_Smoke_sid_id$"
}'
