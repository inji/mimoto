VerifiablePresentationAuthorization:
   Mimoto_VerifiablePresentationAuthorization_all_Valid_Smoke_sid:
      endPoint: /v1/mimoto/wallets/{walletId}/presentations
      description: Verify that a Verifiable Presentation (VP) is successfully created when valid data is provided
      uniqueIdentifier: TC_Mimoto_VerifiablePresentationAuthorization_01
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_UnlockWallet_01
      checkErrorsOnlyInResponse: true
      inputTemplate: mimoto/LoginFlow/Presentations/VerifiablePresentationAuthorization/VerifiablePresentationAuthorization
      outputTemplate: mimoto/LoginFlow/Presentations/VerifiablePresentationAuthorization/VerifiablePresentationAuthorizationResult
      input: '{
        "cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
        "cookieName": "SESSION",
        "walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$",
        "authorizationRequestUrl": "$AUTHORIZATION_REQUEST_URL$$ID:InjiVerifyVpRequest_all_Valid_Smoke_sid_requestId$"
}'
      output: '{
}'

   Mimoto_VerifiablePresentationAuthorization_withInvalid_authorizationRequestUrl_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/presentations
      description: Verify that the request to create a Verifiable Presentation (VP) is rejected or fails when the authorizationRequestUrl is invalid
      uniqueIdentifier: TC_Mimoto_VerifiablePresentationAuthorization_02
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_UnlockWallet_01
      inputTemplate: mimoto/LoginFlow/Presentations/VerifiablePresentationAuthorization/VerifiablePresentationAuthorization
      outputTemplate: mimoto/error2
      input: '{
        "cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
        "cookieName": "SESSION",
        "walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$",
        "authorizationRequestUrl": "invalidRequest"
}'
      output: '{
        "errorCode": "invalid_request"
}'

   Mimoto_VerifiablePresentationAuthorization_withInvalid_walletId_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/presentations
      description: Verify that the request to create a Verifiable Presentation (VP) is rejected when the wallet ID is invalid
      uniqueIdentifier: TC_Mimoto_VerifiablePresentationAuthorization_03
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_UnlockWallet_01
      inputTemplate: mimoto/LoginFlow/Presentations/VerifiablePresentationAuthorization/VerifiablePresentationAuthorization
      outputTemplate: mimoto/error2
      input: '{
        "cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
        "cookieName": "SESSION",
        "walletId": "invalidWalletID",
        "authorizationRequestUrl": "$AUTHORIZATION_REQUEST_URL$$ID:InjiVerifyVpRequest_all_Valid_Smoke_sid_requestId$"
}'
      output: '{
        "errorCode": "invalid_request"
}'

   Mimoto_VerifiablePresentationAuthorization_withLocked_walletId_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/presentations
      description: Verify that the request to create a Verifiable Presentation (VP) is rejected when the wallet ID is locked.
      uniqueIdentifier: TC_Mimoto_VerifiablePresentationAuthorization_04
      role: userDefinedCookie
      restMethod: post
      inputTemplate: mimoto/LoginFlow/Presentations/VerifiablePresentationAuthorization/VerifiablePresentationAuthorization
      outputTemplate: mimoto/error2
      input: '{
        "cookie": "$ID:GoogleLoginToken_all_ValidForLockedWallet_Smoke_sessionCookie$",
        "cookieName": "SESSION",
        "walletId": "$ID:CreateWallet_all_ValidForLockedWallet_Smoke_sid_walletId$",
        "authorizationRequestUrl": "$AUTHORIZATION_REQUEST_URL$$ID:InjiVerifyVpRequest_all_Valid_Smoke_sid_requestId$"
}'
      output: '{
        "errorCode": "wallet_locked"
}'

   Mimoto_VerifiablePresentationAuthorization_withInvalidSession_unAuthorized_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/presentations
      description: Verify that the request to create a Verifiable Presentation (VP) is rejected when the session ID is invalid
      uniqueIdentifier: TC_Mimoto_VerifiablePresentationAuthorization_05
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_UnlockWallet_01
      checkOnlyStatusCodeInResponse: true
      inputTemplate: mimoto/LoginFlow/Presentations/VerifiablePresentationAuthorization/VerifiablePresentationAuthorization
      outputTemplate: mimoto/responseCode
      input: '{
        "cookie": "OGYwNWI5YWQtZjg0MS00NmM2LWJiZTgtOGRmMWYwMGYzNzcy",
        "cookieName": "SESSION",
        "walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$",
        "authorizationRequestUrl": "$AUTHORIZATION_REQUEST_URL$$ID:InjiVerifyVpRequest_all_Valid_Smoke_sid_requestId$"
}'
      output: '{
        "responseCode": "401"
}'

   Mimoto_VerifiablePresentationAuthorization_withNullWalletID_walletId_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/presentations
      description: Verify that the request to create a Verifiable Presentation (VP) is rejected when the wallet ID is null.
      uniqueIdentifier: TC_Mimoto_VerifiablePresentationAuthorization_06
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_UnlockWallet_01
      inputTemplate: mimoto/LoginFlow/Presentations/VerifiablePresentationAuthorization/VerifiablePresentationAuthorization
      outputTemplate: mimoto/error2
      input: '{
        "cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
        "cookieName": "SESSION",
        "walletId": "null",
        "authorizationRequestUrl": "$AUTHORIZATION_REQUEST_URL$$ID:InjiVerifyVpRequest_all_Valid_Smoke_sid_requestId$"
}'
      output: '{
        "errorCode": "invalid_request"
}'