UnlockWallet:
   Mimoto_DeleteWallet_all_Valid_Smoke:
      endPoint: /v1/mimoto/wallets/{walletId}
      description: Verify that the user is able to delete an already created wallet successfully
      uniqueIdentifier: TC_Mimoto_DeleteWallet_01
      role: userDefinedCookie
      restMethod: delete
      checkOnlyStatusCodeInResponse: true
      inputTemplate: mimoto/LoginFlow/Wallet/DeleteWallet/DeleteWallet
      outputTemplate: mimoto/responseCode
      input: '{
      	"cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
      	"cookieName": "SESSION",
      	"walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$"
}'
      output: '{
      "responseCode": "200"
}'

   Mimoto_DeleteWallet_AlreadyDeleted_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}
      description: Verify that deleting an already deleted wallet is not allowed and returns an appropriate error message
      uniqueIdentifier: TC_Mimoto_DeleteWallet_02
      role: userDefinedCookie
      restMethod: delete
      inputTemplate: mimoto/LoginFlow/Wallet/DeleteWallet/DeleteWallet
      outputTemplate: mimoto/error2
      input: '{
      	"cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
      	"cookieName": "SESSION",
      	"walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$"
}'
      output: '{
      "errorCode": "invalid_request"
}'

   Mimoto_DeleteWallet_Invalid_WalletId_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}
      description: Verify that deleting a wallet with an invalid wallet ID is not allowed and returns an appropriate error message
      uniqueIdentifier: TC_Mimoto_DeleteWallet_03
      role: userDefinedCookie
      restMethod: delete
      inputTemplate: mimoto/LoginFlow/Wallet/DeleteWallet/DeleteWallet
      outputTemplate: mimoto/error2
      input: '{
      	"cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
      	"cookieName": "SESSION",
      	"walletId": "invalid"
}'
      output: '{
      "errorCode": "invalid_request"
}'

   Mimoto_DeleteWallet_Empty_WalletId_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}
      description: Verify that deleting a wallet without providing a wallet ID is not allowed and returns an appropriate error message
      uniqueIdentifier: TC_Mimoto_DeleteWallet_04
      role: userDefinedCookie
      restMethod: delete
      inputTemplate: mimoto/LoginFlow/Wallet/DeleteWallet/DeleteWallet
      outputTemplate: mimoto/error2
      input: '{
      	"cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
      	"cookieName": "SESSION",
      	"walletId": ""
}'
      output: '{
      "errorCode": "invalid_request"
}'

   Mimoto_DeleteWallet_Space_WalletId_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}
      description: Verify that deleting a wallet with spaces in the wallet ID is not allowed and returns an appropriate error message
      uniqueIdentifier: TC_Mimoto_DeleteWallet_05
      role: userDefinedCookie
      restMethod: delete
      inputTemplate: mimoto/LoginFlow/Wallet/DeleteWallet/DeleteWallet
      outputTemplate: mimoto/error2
      input: '{
      	"cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
      	"cookieName": "SESSION",
      	"walletId": " "
}'
      output: '{
      "errorCode": "invalid_request"
}'

   Mimoto_DeleteWallet_WithoutLogin_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}
      description: Verify that deleting a wallet without a valid login session is not allowed and returns an appropriate authentication error
      uniqueIdentifier: TC_Mimoto_DeleteWallet_06
      role: userDefinedCookie
      restMethod: delete
      checkOnlyStatusCodeInResponse: true
      inputTemplate: mimoto/LoginFlow/Wallet/DeleteWallet/DeleteWallet
      outputTemplate: mimoto/responseCode
      input: '{
      	"cookie": "withoutLogin",
      	"cookieName": "SESSION",
      	"walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$"
}'
      output: '{
      "responseCode": "401"
}'

   Mimoto_DeleteWallet_ExpiredSession_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}
      description: Verify that deleting a wallet with an expired session fails as expected
      uniqueIdentifier: TC_Mimoto_DeleteWallet_07
      role: userDefinedCookie
      restMethod: delete
      checkOnlyStatusCodeInResponse: true
      inputTemplate: mimoto/LoginFlow/Wallet/DeleteWallet/DeleteWallet
      outputTemplate: mimoto/responseCode
      input: '{
      	"cookie": "OGYwNWI5YWQtZjg0MS00NmM2LWJiZTgtOGRmMWYwMGYzNzcy",
      	"cookieName": "SESSION",
      	"walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$"
}'
      output: '{
      "responseCode": "401"
}'
