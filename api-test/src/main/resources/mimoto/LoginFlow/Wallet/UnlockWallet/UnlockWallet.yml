UnlockWallet:
   Mimoto_UnlockWallet_all_Valid_Smoke:
      endPoint: /v1/mimoto/wallets/{walletId}/unlock
      description: Verify that the created wallet can be unlocked successfully using valid credentials/PIN.
      uniqueIdentifier: TC_Mimoto_UnlockWallet_01
      role: userDefinedCookie
      restMethod: post
      inputTemplate: mimoto/LoginFlow/Wallet/UnlockWallet/UnlockWallet
      outputTemplate: mimoto/LoginFlow/Wallet/UnlockWallet/UnlockWalletResult
      input: '{
      	"cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
      	"cookieName": "SESSION",
      	"walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$",
      	"walletPin": "123456"
}'
      output: '{
      "walletName": "$ID:CreateWallet_all_Valid_Smoke_sid_walletName$",
      "walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$"
}'

   Mimoto_UnlockWallet_Invalid_WalletId_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/unlock
      description: Verify that unlocking a wallet with an invalid wallet ID is not allowed and returns an appropriate error message
      uniqueIdentifier: TC_Mimoto_UnlockWallet_02
      role: userDefinedCookie
      restMethod: post
      inputTemplate: mimoto/LoginFlow/Wallet/UnlockWallet/UnlockWallet
      outputTemplate: mimoto/error2
      input: '{
      	"cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
      	"cookieName": "SESSION",
      	"walletId": "invalid",
      	"walletPin": "123456"
}'
      output: '{
      "errorCode": "invalid_request"
}'

   Mimoto_UnlockWallet_Incorrect_WalletPin_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/unlock
      description: Verify that unlocking a wallet with an incorrect wallet PIN is not allowed and returns an appropriate error message
      uniqueIdentifier: TC_Mimoto_UnlockWallet_03
      role: userDefinedCookie
      restMethod: post
      inputTemplate: mimoto/LoginFlow/Wallet/UnlockWallet/UnlockWallet
      outputTemplate: mimoto/error2
      input: '{
      	"cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
      	"cookieName": "SESSION",
      	"walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$",
      	"walletPin": "876532"
}'
      output: '{
      "errorCode": "invalid_pin"
}'

   Mimoto_UnlockWallet_WithoutLogin_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/unlock
      description: Validate wallet unlocking without an active login session and verify that the operation fails
      uniqueIdentifier: TC_Mimoto_UnlockWallet_04
      role: userDefinedCookie
      restMethod: post
      checkOnlyStatusCodeInResponse: true
      inputTemplate: mimoto/LoginFlow/Wallet/UnlockWallet/UnlockWallet
      outputTemplate: mimoto/responseCode
      input: '{
      	"cookie": "withoutLogin",
      	"cookieName": "SESSION",
      	"walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$",
      	"walletPin": "123456"
}'
      output: '{
      "responseCode": "401"
}'

   Mimoto_UnlockWallet_Invalid_WalletPin_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/unlock
      description: Verify that unlocking a wallet with an invalid wallet PIN is not allowed and returns an appropriate error message
      uniqueIdentifier: TC_Mimoto_UnlockWallet_06
      role: userDefinedCookie
      restMethod: post
      inputTemplate: mimoto/LoginFlow/Wallet/UnlockWallet/UnlockWallet
      outputTemplate: mimoto/error2
      input: '{
      	"cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
      	"cookieName": "SESSION",
      	"walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$",
      	"walletPin": "87653"
}'
      output: '{
      "errorCode": "invalid_request"
}'