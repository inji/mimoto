DownloadIssuerCredential:
   Mimoto_DownloadIssuerCredential_GoogleLogin_MockMdl_01:
      endPoint: /v1/mimoto/wallets/{walletId}/credentials
      description: Download the MockMdl mso_mdoc credential using Google login
      uniqueIdentifier: TC_Mimoto_DownloadIssuerCredential_GoogleLogin_MockMdl_01
      role: userDefinedCookie
      restMethod: get
      additionalDependencies: TC_Mimoto_AuthorizationCode_GoogleLogin_MockMdl_01,TC_Mimoto_GoogleLoginToken_01,TC_Mimoto_UnlockWallet_01
      checkErrorsOnlyInResponse: true
      inputTemplate: mimoto/LoginFlow/DownloadMockCredential/DownloadIssuerCredential/DownloadIssuerCredential
      outputTemplate: mimoto/LoginFlow/DownloadMockCredential/DownloadIssuerCredential/DownloadIssuerCredentialResult
      input: '{
  "code": "$ID:ESignet_AuthorizationCode_GoogleLogin_MockMdl_01_sid_code$",
  "state": "$ID:IssuersAuthorize_GoogleLogin_MockMdl_01_state$",
  "issuer": "MockMdl",
  "credentialConfigurationId": "DrivingLicenseCredential",
  "walletId": "$ID:CreateWallet_all_Valid_Smoke_sid_walletId$",
  "cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
  "cookieName": "SESSION",
  "acceptLanguage": "en"
}'
      output: '{
  "issuerDisplayName": "Mock Mobile Driving License",
  "credentialTypeDisplayName": "DrivingLicenseCredential"
}'

   Mimoto_DownloadIssuerCredential_GoogleLogin_MockMdl_InvalidWallet_Neg:
      endPoint: /v1/mimoto/wallets/{walletId}/credentials
      description: Verify that downloading the MockMdl credential with an invalid wallet ID using Google login fails
      uniqueIdentifier: TC_Mimoto_DownloadIssuerCredential_GoogleLogin_MockMdl_02
      role: userDefinedCookie
      restMethod: get
      additionalDependencies: TC_Mimoto_GoogleLoginToken_01,TC_Mimoto_UnlockWallet_01
      inputTemplate: mimoto/LoginFlow/DownloadMockCredential/DownloadIssuerCredential/DownloadIssuerCredential
      outputTemplate: mimoto/error2
      input: '{
  "code": "invalid",
  "state": "invalid-state",
  "issuer": "MockMdl",
  "credentialConfigurationId": "DrivingLicenseCredential",
  "walletId": "invalid-wallet-id",
  "cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
  "cookieName": "SESSION",
  "acceptLanguage": "en"
}'
      output: '{
  "errorCode": "invalid_request"
}'

