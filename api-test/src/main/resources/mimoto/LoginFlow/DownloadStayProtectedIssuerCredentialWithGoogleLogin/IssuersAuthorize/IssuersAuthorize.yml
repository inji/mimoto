IssuersAuthorize:
   Mimoto_IssuersAuthorize_StayProtectedForGoogleLogin_All_Valid_Smoke_sid:
      endPoint: /v1/mimoto/issuers/{issuerId}/authorize
      description: Verify that an OpenID4VCI authorization URL and DPoP/PKCE session state are created for the logged-in Google user before downloading the StayProtected credential
      uniqueIdentifier: TC_Mimoto_IssuersAuthorizeForStayProtectedGoogleLogin_01
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_GoogleLoginToken_01,TC_Mimoto_UnlockWallet_01
      checkOnlyStatusCodeInResponse: true
      inputTemplate: mimoto/LoginFlow/DownloadStayProtectedIssuerCredentialWithGoogleLogin/IssuersAuthorize/IssuersAuthorize
      outputTemplate: mimoto/responseCode
      input: '{
      "issuerId": "StayProtected",
      "redirectUri": "$INJIREDIRECTURI$",
      "credentialConfigurationId": "InsuranceCredential",
      "uiLocales": "en",
      "cookie": "$ID:GoogleLoginToken_all_Valid_Smoke_sessionCookie$",
      "cookieName": "SESSION"
}'
      output: '{
      "responseCode": "200"
}'

   Mimoto_IssuersAuthorizeForStayProtectedGoogleLogin_InvalidIssuerId_Neg:
      endPoint: /v1/mimoto/issuers/{issuerId}/authorize
      description: Verify that building the authorization URL fails with a bad request when an invalid issuerId is provided for the logged-in Google user
      uniqueIdentifier: TC_Mimoto_IssuersAuthorizeForStayProtectedGoogleLogin_03
      role: userDefinedCookie
      restMethod: post
      additionalDependencies: TC_Mimoto_GoogleLoginToken_01,TC_Mimoto_UnlockWallet_01
