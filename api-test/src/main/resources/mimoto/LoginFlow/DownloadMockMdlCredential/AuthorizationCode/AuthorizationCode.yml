AuthorizationCode:
   Mimoto_ESignet_AuthorizationCode_GoogleLogin_MockMdl_01_sid:
      endPoint: /v1/esignet/authorization/auth-code
      description: Generate a Google-login authorization code for the MockMdl mso_mdoc credential
      uniqueIdentifier: TC_Mimoto_AuthorizationCode_GoogleLogin_MockMdl_01
      role: resident
      restMethod: post
      additionalDependencies: TC_Mimoto_AuthenticateUser_GoogleLogin_MockMdl_01
      checkOnlyStatusCodeInResponse: true
      validityCheckRequired: true
      inputTemplate: mimoto/LoginFlow/DownloadMockMdlCredential/AuthorizationCode/AuthorizationCode
      outputTemplate: mimoto/LoginFlow/DownloadMockMdlCredential/AuthorizationCode/AuthorizationCodeResult
      input: '{
  "encodedHash": "$ID:ESignet_OAuthDetailsRequest_GoogleLogin_MockMdl_01_sid_encodedResp$",
  "requestTime": "$TIMESTAMP$",
  "transactionId": "$ID:ESignet_OAuthDetailsRequest_GoogleLogin_MockMdl_01_sid_transactionId$"
}'
      output: '{
  "responseCode": "200"
}'

   Mimoto_ESignet_AuthorizationCode_GoogleLogin_MockMdl_ForNeg_InvalidIssuer_sid:
      endPoint: /v1/esignet/authorization/auth-code
      description: Mint a fresh, unused Google-login authorization code for the MockMdl InvalidIssuer_Neg download test case
      uniqueIdentifier: TC_Mimoto_AuthorizationCode_GoogleLogin_MockMdl_02
      role: resident
      restMethod: post
      additionalDependencies: TC_Mimoto_AuthenticateUser_GoogleLogin_MockMdl_02
      checkOnlyStatusCodeInResponse: true
      validityCheckRequired: true
      inputTemplate: mimoto/LoginFlow/DownloadMockMdlCredential/AuthorizationCode/AuthorizationCode
      outputTemplate: mimoto/LoginFlow/DownloadMockMdlCredential/AuthorizationCode/AuthorizationCodeResult
      input: '{
  "encodedHash": "$ID:ESignet_OAuthDetailsRequest_GoogleLogin_MockMdl_ForNeg_InvalidIssuer_sid_encodedResp$",
  "requestTime": "$TIMESTAMP$",
  "transactionId": "$ID:ESignet_OAuthDetailsRequest_GoogleLogin_MockMdl_ForNeg_InvalidIssuer_sid_transactionId$"
}'
      output: '{
  "responseCode": "200"
}'
