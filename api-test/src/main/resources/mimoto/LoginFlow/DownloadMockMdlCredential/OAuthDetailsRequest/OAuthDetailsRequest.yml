OAuthDetailsRequest:
   Mimoto_ESignet_OAuthDetailsRequest_GoogleLogin_MockMdl_01_sid:
      endPoint: /v1/esignet/authorization/v2/oauth-details
      description: Retrieve Google-login authentication details for the MockMdl mso_mdoc credential
      uniqueIdentifier: TC_Mimoto_OAuthDetailsRequest_GoogleLogin_MockMdl_01
      role: resident
      restMethod: post
      additionalDependencies: TC_Mimoto_IssuersAuthorize_GoogleLogin_MockMdl_01
      checkOnlyStatusCodeInResponse: true
      inputTemplate: mimoto/LoginFlow/DownloadMockMdlCredential/OAuthDetailsRequest/OAuthDetailsRequest
      outputTemplate: mimoto/LoginFlow/DownloadMockMdlCredential/OAuthDetailsRequest/OAuthDetailsRequestResult
      input: '{
  "requestTime": "$TIMESTAMP$",
  "clientId": "$GETCLIENTIDFORMDLFROMMIMOTOACTUATOR$",
  "scope": "sample_vc_mdoc",
  "responseType": "code",
  "redirectUri": "$INJIREDIRECTURI$",
  "display": "popup",
  "prompt": "login",
  "acrValues": "mosip:idp:acr:generated-code mosip:idp:acr:linked-wallet mosip:idp:acr:biometrics",
  "nonce": "$UNIQUENONCEVALUEFORESIGNET$",
  "state": "$ID:IssuersAuthorize_GoogleLogin_MockMdl_01_state$",
  "claimsLocales": "en"
}'
      output: '{
  "responseCode": "200"
}'

   Mimoto_ESignet_OAuthDetailsRequest_GoogleLogin_MockMdl_ForNeg_InvalidIssuer_sid:
      endPoint: /v1/esignet/authorization/v2/oauth-details
      description: Mint a fresh Google-login transaction for the MockMdl InvalidIssuer_Neg download test case
      uniqueIdentifier: TC_Mimoto_OAuthDetailsRequest_GoogleLogin_MockMdl_02
      role: resident
      restMethod: post
      additionalDependencies: TC_Mimoto_IssuersAuthorize_GoogleLogin_MockMdl_04
      checkOnlyStatusCodeInResponse: true
      inputTemplate: mimoto/LoginFlow/DownloadMockMdlCredential/OAuthDetailsRequest/OAuthDetailsRequest
      outputTemplate: mimoto/LoginFlow/DownloadMockMdlCredential/OAuthDetailsRequest/OAuthDetailsRequestResult
      input: '{
  "requestTime": "$TIMESTAMP$",
  "clientId": "$GETCLIENTIDFORMDLFROMMIMOTOACTUATOR$",
  "scope": "sample_vc_mdoc",
  "responseType": "code",
  "redirectUri": "$INJIREDIRECTURI$",
  "display": "popup",
  "prompt": "login",
  "acrValues": "mosip:idp:acr:generated-code mosip:idp:acr:linked-wallet mosip:idp:acr:biometrics",
  "nonce": "$UNIQUENONCEVALUEFORESIGNET$",
  "state": "$ID:IssuersAuthorize_GoogleLogin_MockMdl_ForNeg_InvalidIssuer_sid_state$",
  "claimsLocales": "en"
}'
      output: '{
  "responseCode": "200"
}'
