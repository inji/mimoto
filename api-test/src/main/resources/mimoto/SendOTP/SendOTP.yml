SendOTP:
   Resident_SendOTP_Valid_UIN_All_Smoke:
      endPoint: /resident/v1/req/otp
      description: Verifying that the OTP request is created successfully for a resident with a valid UIN
      uniqueIdentifier: TC_Mimoto_SendOTP_01
      role: resident
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: resident/SendOTP/createSendOTP
      outputTemplate: resident/SendOTP/createSendOTPResult
      input: '{
    "transactionID": "$TRANSACTIONID$",
    "requestTime": "$TIMESTAMP$",
    "individualId": "$ID:AddIdentity_withValidParameters_smoke_Pos_UIN$",
    "individualIdType": "UIN"
}'
      output: '{
        "maskedEmail": "XXsXXeXXaXXoXXtXXn@gmail.com"
}'

   Resident_SendOTP_Invalid_UIN_Neg:
      endPoint: /resident/v1/req/otp
      description: Validating the resident OTP request creation with an invalid UIN
      uniqueIdentifier: TC_Mimoto_SendOTP_02
      role: resident
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: resident/SendOTP/createSendOTP
      outputTemplate: resident/error
      input: '{
    "transactionID": "$TRANSACTIONID$",
    "requestTime": "$TIMESTAMP$",
    "individualId": "34hgf$",
    "individualIdType": "UIN"
}'
      output: '{
        "maskedEmail": "XXsXXeXXaXXoXXtXXn@gmail.com"
}'

   Resident_SendOTP_Invalid_VID_Neg:
      endPoint: /resident/v1/req/otp
      description: Verifying that the system returns an appropriate error when creating an OTP request with an invalid VID
      uniqueIdentifier: TC_Mimoto_SendOTP_03
      role: resident
      restMethod: post
      inputTemplate: resident/SendOTP/createSendOTP
      outputTemplate: resident/error
      input: '{
    "transactionID": "$TRANSACTIONID$",
    "requestTime": "$TIMESTAMP$",
    "individualId": "$45hgv",
    "individualIdType": "VID"
}'
      output: '{
        
}'