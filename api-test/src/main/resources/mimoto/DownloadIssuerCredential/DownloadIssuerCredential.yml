      "cookieName": "SESSION",
      "issuer": "MosipInvalid",
      "credential": "MOSIPVerifiableCredential"
}'
      output: '{
	"errors":[
		{
		"errorCode":"RESIDENT-APP-035"
		}
	]
}'

