OAuthDetailsRequest:
   Mimoto_ESignet_OAuthDetailsRequest_all_Valid_Smoke_sid:
      endPoint: /v1/esignet/authorization/v2/oauth-details
      description: Verify that the system successfully retrieves the authentication details for downloading the Sunbird credential when all valid parameters are provided
      uniqueIdentifier: TC_Mimoto_OAuthDetailsRequest_01
      role: resident
      restMethod: post
      additionalDependencies: TC_Mimoto_IssuersAuthorize_01
      checkOnlyStatusCodeInResponse: true
      inputTemplate: mimoto/OAuthDetailsRequest/OAuthDetailsRequest
      outputTemplate: mimoto/responseCode
      input: '{
      	"requestTime": "$TIMESTAMP$",
      	"clientId": "$GETCLIENTIDFORMOSIPIDFROMMIMOTOACTUATOR$",
      	"scope": "mosip_identity_vc_ldp",
      	"responseType": "code",
      	"redirectUri": "$INJIREDIRECTURI$",
      	"display": "popup",
	    "prompt": "login",
	    "acrValues": "mosip:idp:acr:generated-code mosip:idp:acr:linked-wallet mosip:idp:acr:biometrics",
	    "nonce": "$UNIQUENONCEVALUEFORESIGNET$",
	    "state": "eree2311",
	    "claimsLocales": "en",
	    "codeChallenge": "$ID:IssuersAuthorize_Mosip_All_Valid_Smoke_sid_authorizationUrl$",
        "codeChallengeMethod": "S256"
}'
      output: '{
      "responseCode": "200"
}'

