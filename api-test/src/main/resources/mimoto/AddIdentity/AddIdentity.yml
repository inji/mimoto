AddIdentity:
   Mimoto_AddIdentity_withValidParameters_smoke_Pos:
      endPoint: /idrepository/v1/identity/
      description: Validate that the system successfully creates a new identity in ID Repository using all valid input parameters
      uniqueIdentifier: TC_Mimoto_AddIdentity_01
      role: idrepo
      restMethod: post
      inputTemplate: mimoto/AddIdentity/addIdentity_$LANGNUMBER$
      outputTemplate: mimoto/AddIdentity/addIdentityResult
      input: '{
  "value": "$BIOVALUE$",
  "id": "mosip.id.create",
  "registrationId": "$RID$",
  "biometricReferenceId": "23452353",
   "UIN": "$UIN$",
  "dateOfBirth": "1992/04/15",
  "postalCode": "14022",
  "email": "Mimoto_AddIdentity_withValidParameters_smoke_Pos@mosip.net",
  "phone": "9876543210",
  "referenceIdentityNumber": "6789545678878",
  "version": "v1",
   "introducerRID": "212124324784879",
   "introducerUIN": "212124324784879",
   "category": "individualBiometrics",
   "requesttime": "$TIMESTAMP$"
}'
      output: '{
  "status":"ACTIVATED"
}'

   Mimoto_AddIdentity_MockMdl_smoke_Pos:
      endPoint: /v1/mock-identity-system/identity
      description: Create a mock identity for MockMdl credential download authentication
      uniqueIdentifier: TC_Mimoto_AddIdentity_MockMdl_01
      role: resident
      restMethod: post
      inputTemplate: mimoto/AddIdentity/addMockMdlIdentity
      outputTemplate: mimoto/AddIdentity/addIdentityResult
      input: '{
  "requestTime": "$TIMESTAMP$",
  "individualId": "$MOCKMDLINDIVIDUALID$",
  "pin": "111111",
  "fullName": "Mock MDL User",
  "givenName": "Mock",
  "familyName": "User",
  "gender": "Male",
  "dateOfBirth": "1992/04/15",
  "streetAddress": "MG Road",
  "locality": "Bengaluru",
  "region": "Karnataka",
  "postalCode": "560001",
  "country": "India",
  "email": "$EMAILVALUE$",
  "phone": "$PHONENUMBERFORIDENTITY$"
}'
      output: '{
  "status": "mock identity data created successfully"
}'

