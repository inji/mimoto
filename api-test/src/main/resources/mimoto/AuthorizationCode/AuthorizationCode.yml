AuthorizationCode:
   Mimoto_ESignet_AuthorizationCode_uin_All_Valid_Smoke_sid:
      endPoint: /v1/esignet/authorization/auth-code
      description: Validate that the system successfully generates an authorization code to download credentials from the issuer
      uniqueIdentifier: TC_Mimoto_AuthorizationCode_01
      role: resident
      restMethod: post
      additionalDependencies: TC_Mimoto_AuthenticateUser_01
      checkOnlyStatusCodeInResponse: true
      validityCheckRequired: true
      inputTemplate: mimoto/AuthorizationCode/AuthorizationCode
      outputTemplate: mimoto/responseCode
      input: '{
        "encodedHash": "$ID:ESignet_OAuthDetailsRequest_all_Valid_Smoke_sid_encodedResp$",
      	"requestTime": "$TIMESTAMP$",
      	"transactionId": "$ID:ESignet_OAuthDetailsRequest_all_Valid_Smoke_sid_transactionId$"
}'
      output: '{
      "responseCode": "200"
}'

   Mimoto_ESignet_AuthorizationCode_ForNeg_Issuer_sid:
