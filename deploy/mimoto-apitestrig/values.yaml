## Overrides for the mimoto-apitestrig helm chart (../../helm/mimoto-apitestrig).
## Refer to ../../helm/mimoto-apitestrig/values.yaml for the full list of configurable values.

modules:
  mimoto:
    enabled: true
    image:
      repository: injistackdev2/apitest-mimoto
      tag: release-1.0.x
      pullPolicy: Always

apitestrig:
  configmaps:
    apitestrig:
      authDemoServiceBaseURL: http://authdemo.authdemo
      authDemoServicePort: 80
      authCertsPath: '/home/inji/authcerts'
  secrets:
    s3:
      s3-user-secret: 'password'
